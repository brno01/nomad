# ---------------------------------------------------------------- serviços sem arquivo de unit no repo
# (as units achadas como arquivo no repo entram sozinhas)

[[service]]
name = "nomad-dns-failover.timer"
repo = "nomad-enhancement"
file = "scripts/dns-failover-install.sh"
scope = "sistema"
description = "A cada 30 s testa o Pi-hole; após 2 falhas desliga o DNS da Tailscale e religa quando ele volta."
check = "systemctl status nomad-dns-failover.timer"

# ---------------------------------------------------------------- notas manuais → nós (fixa a ligação)

[note_links]
"Contas do Claude por área" = ["Claude Code e Orca"]
"Wine no nomad" = ["Wine e programas do Windows"]

# ---------------------------------------------------------------- projetos ligados
# A única ponte para outro projeto no cofre: só o nó "Projetos ligados" tem link para a central dele.
# Em "uses", texto simples (sem [[links]]): o que é do outro projeto é documentado lá.

[[bridge]]
label = "Cerberus"
central = "projects/cerberus/Cerberus"
summary = "o servidor de casa (atheron). O nomad funciona sem ele; com ele, ganha os serviços abaixo."
uses = [
  "**Pi-hole**: único DNS da tailnet; se cair, o `nomad-dns-failover` desliga o DNS da Tailscale aqui.",
  "**NAS por SMB**: pastas `files` e `vault` (o cofre do Obsidian, aberto direto em `/var/mnt/nas/vault`).",
  "**Backup Borg**: usuário `backup-nomad`, só-acrescenta, no HD do NAS.",
  "**Cadastro** (`cerberus-nomad`): recebe a chave do backup por Taildrop e devolve o `server-info.json`.",
  "**Build do pendrive**: roda no atheron, isolado em `/srv/ssd/nomad`; credenciais `nomad-*` ficam no cofre do painel.",
  "**Jogos**: servidores no container `games` (AMP, Ragnarok); o cliente do Ragnarok roda aqui pelo Wine.",
]

# ---------------------------------------------------------------- atalhos e links

[[quick]]
what = "Versão do sistema e deployments"
cmd = "rpm-ostree status"

[[quick]]
what = "Serviços com falha"
cmd = "systemctl --failed; systemctl --user --failed"

[[quick]]
what = "Timers do usuário"
cmd = "systemctl --user list-timers"

[[quick]]
what = "Tailnet: aparelhos"
cmd = "tailscale status"

[[quick]]
what = "DNS failover do nomad"
cmd = "journalctl -u nomad-dns-failover -n 20"

[[quick]]
what = "Apps Flatpak"
cmd = "flatpak list --app"

[[quick]]
what = "Containers de desenvolvimento"
cmd = "distrobox list"

[[quick]]
what = "Log desta documentação"
cmd = "journalctl --user -u nomad-obsidian -n 50"

[[link]]
label = "Tailscale: painel da tailnet"
url = "https://login.tailscale.com/admin/machines"
