# Fontes e nós do mapa do nomad no Obsidian (lido por obsidian/export_nomad.py).
#
# Ajuste aqui, não nas notas geradas: elas são reescritas a cada exportação.
# Padrões de arquivo ("files") têm a forma "<repo>:<prefixo>"; "<repo>:" pega o repo inteiro.

# Cofre do NAS (SMB do atheron), o mesmo que o Obsidian abre. Escrever por aqui faz o Obsidian
# ver as mudanças na hora; o ~/Vault (Syncthing) existe só para o celular.
vault = "/var/mnt/nas/vault"
# Repos git novos nestas pastas entram sozinhos no nó "Novos (classificar)".
discover = ["~/development/personal"]
# Repositórios com projeto próprio no cofre não entram no nomad (projetos apartados).
ignore = ["cerberus", "sinapses"]

# ---------------------------------------------------------------- repositórios

[[source]]
name = "nomad"
url = "ssh://atheron-nomad-git/root/nomad"
description = "O sistema do pendrive: imagem Bazzite (bootc), tudo que vai para o /etc, build do disco e gravador pelo Windows."
keywords = ["pendrive", "DataTraveler", "write-nomad", "install-to-disk", "overlay/etc"]

[[source]]
name = "nomad-enhancement"
path = "~/development/personal/nomad-enhancement"
keywords = ["nomad-enhancement", "wifi-powersave", "nomad-dns-failover", "dns-failover"]

[[source]]
name = "dotfiles"
path = "~/development/dotfiles"
keywords = ["dotfiles", "install-desktop", "claude-account", "dev-project", "ecc-sync"]

[[source]]
name = "tailnet-dns-failover"
path = "~/development/personal/tailnet-dns-failover"
keywords = ["tailnet-dns-failover", "GitHub Actions", "tag:dns-failover"]

[[source]]
name = "kindle-monitor"
path = "~/development/personal/kindle-monitor"
description = "Kindle Paperwhite 5 com jailbreak como monitor de recursos em e-ink do atheron: servidor Python que gera um PNG, Tailscale em modo userspace e um laço com FBInk. Notas de operação e decisões em notes/."
keywords = ["kindle-monitor", "Kindle", "Paperwhite", "Jobman", "FBInk", "e-ink"]

# ---------------------------------------------------------------- descrições fixas
# Têm prioridade sobre o que o exportador acha no CLAUDE.md, no README ou no cabeçalho do script.

[descriptions]
"nomad-enhancement:obsidian/" = "Exportador desta documentação para o cofre do Obsidian, com timer systemd --user."
"nomad-enhancement:docs/" = "Páginas avulsas (aviso do iPhone para quando o Pi-hole cai)."
"dotfiles:desktop/" = "Visual macOS Tahoe no KDE Plasma: temas, painéis, efeitos do KWin e troca claro/escuro."
"dotfiles:claude/" = "Configuração global do Claude Code: settings, CLAUDE.md, statusline, skills e seleção do ECC."
"dotfiles:bin/" = "Comandos instalados em ~/.local/bin (dev-project, ecc-sync, orca-ide)."
"dotfiles:shell/" = "Trechos de shell linkados em ~/.bashrc.d (função claude por área)."
"dotfiles:templates/" = "Modelos de orca.yaml e CLAUDE.md usados pelo dev-project."
"dotfiles:git/" = "gitconfig compartilhado, incluído no ~/.gitconfig."
"tailnet-dns-failover:.github/" = "Workflows do GitHub Actions: failover a cada 5 min e testes."

