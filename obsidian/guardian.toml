# Política do vigia do Obsidian (obsidian/guardian.py). Ajuste aqui, não no código.

[guardian]
vault = "/var/mnt/nas/vault"
interval = 20          # segundos entre conferências (o cofre é um compartilhamento de rede: sem inotify)
quiet_polls = 2        # ciclos sem mudança antes de agir (os exportadores escrevem várias notas seguidas)
full_every = 600       # passada completa mesmo sem mudança (pega o Obsidian reescrevendo o graph.json)
hub_color = "9B9328"   # nó de mapa (tag mapa) sem tipo conhecido
# vocabulário controlado de tags e status (compartilhado com o segundo cérebro, que grava as conversas)
taxonomy = "~/development/dotfiles/claude/second-brain/taxonomia.toml"
# pastas que o vigia ignora por inteiro (além de .obsidian, .stversions, .trash, .lixeira)
ignore = ["attachments", "templates", "daily", "archive", "drawings", "bases", "inbox"]

# Projetos conhecidos: nó central e cor. Projeto novo aparece sozinho e ganha a cor mais distinta de todas as já usadas.
[projects.nomad]
central = "Central do nomad"
color = "39FF14"   # verde fluorescente

[projects.cerberus]
central = "Cerberus"
color = "FFFFFF"

# Cor por tipo de nó (tag map/<tipo>): a mesma nos dois projetos.
[tags]
ia = "A87FF5"
componentes = "F97316"
containers = "14B8A6"
servicos = "38BDF8"
docs = "9CA3AF"
atalhos = "EAB308"
projetos = "F472B6"
sistema = "56A325"
repos = "E66A63"
# quadro da trilha (T-0002): cor escolhida pelo snippet de distância CIE Lab, distante das demais
tarefas = "3FFB8D"

# Cor das folhas por tag de tipo. REGRA: nenhuma cor se repete nem se parece com outra (distância CIE Lab >= 20),
# conferido por `guardian.py --lint-colors` e por teste; a legenda do cofre ("Legenda do grafo") sai desta mesma lista.
[leaf_tags]
guia = "E7B88A"
pesquisa = "95B47E"
decisao = "FCABB8"
conversa = "E8ACF7"
plano = "6690DF"
historia = "BC7DA4"
config = "C47F6E"
blueprint = "239EB4"
# cartões da trilha (T-0002): cor escolhida pelo snippet de distância CIE Lab, distante das demais
tarefa = "85E6A1"

# O que não é hub nem folha de tipo conhecido (entra antes da cor de pasta de cada projeto).
[extra_groups]
'path:"Home.md"' = "B37730"
'path:"Legenda do grafo.md"' = "329556"
'path:"daily"' = "95824F"
'path:"areas/trabalho"' = "AA6CBC"

# Aparência do grafo, pensada para árvore. Aplicada uma vez e de novo só quando esta seção mudar.
[graph_defaults]
showTags = false
showOrphans = true
hideUnresolved = true
showArrow = true
textFadeMultiplier = -1
nodeSizeMultiplier = 1.3
linkDistance = 90
repelStrength = 14
centerStrength = 0.3
