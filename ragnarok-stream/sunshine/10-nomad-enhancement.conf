# nomad-enhancement: ragnarok-stream/sunshine/10-nomad-enhancement.conf
# Drop-in for the Homebrew Sunshine user unit app-dev.lizardbyte.app.Sunshine.service
# (alias sunshine.service). Installed by scripts/ragnarok-stream-install.sh.
#
# LIBVA_*: Homebrew's libva only searches /home/linuxbrew/.linuxbrew/lib/dri (a symlink into
# the mesa keg), but the Intel iHD driver lives in the host's /usr/lib64/dri. Without these two
# lines Sunshine falls back to software x264 encoding.
#
# ExecStopPost: the override that Bazzite's `ujust setup-sunshine` is supposed to apply but
# does not, because it targets a unit called homebrew.sunshine. It re-enables the physical
# outputs and kills the virtual monitor if Sunshine dies mid-stream.
[Service]
Environment=LIBVA_DRIVERS_PATH=/usr/lib64/dri
Environment=LIBVA_DRIVER_NAME=iHD
ExecStopPost=-/usr/libexec/sunshine-stop-vmon
