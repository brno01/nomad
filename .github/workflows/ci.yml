name: ci

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Install bats
        run: sudo apt-get update -qq && sudo apt-get install -y -qq bats

      - name: Shellcheck
        run: shellcheck scripts/*.sh

      # Tests that need gitleaks skip themselves when it is not installed.
      - name: Bats tests
        run: bats tests/

      # test_guardian.py fails to import today (dataclass on a module that is
      # not registered in sys.modules), so it is left out until fixed.
      - name: Exporter tests
        run: uv run --no-project --with pytest pytest obsidian/tests --ignore=obsidian/tests/test_guardian.py -q

      - name: ragnarok-stream tests
        run: uv run --no-project --with pytest --with vdf pytest ragnarok-stream/tests -q

      # pwsh is preinstalled on the GitHub Ubuntu runners
      - name: Windows launcher tests (PowerShell 7)
        run: pwsh -NoProfile -File windows/tests/test_s22_microscopio.ps1
